name: 버그 신고
description: 생각대로 동작하지 않는 것을 알려 주세요
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요?
      description: 무엇을 했고, 어떻게 될 거라 생각했는데, 실제로는 어떻게 됐는지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 다시 겪으려면
      placeholder: |
        1. 할 일을 체크하고
        2. 날짜를 넘기면
        3. ...
  - type: input
    id: version
    attributes:
      label: Aru 버전
      description: 설정 화면 맨 아래에 보여요.
      placeholder: "0.2.4"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: macOS 버전
      placeholder: "macOS 15.1"
