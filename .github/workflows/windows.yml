# 초안. CI에서 아직 돌려 보지 않았다.
#
# Windows판 검증·패키징(docs/WINDOWS_PORT.md §5.2). 맥에서 돌릴 수 없는 것만 여기서 본다:
# 진짜 NTFS 위 cargo test, 실제 Windows의 Chrome으로 e2e, MSIX 패키지 문맥(alias·가상화 끄기), WACK.
name: windows

on:
  push:
    branches: [mas, main, windows]
  workflow_dispatch:

# 같은 브랜치에 새 푸시가 오면 이전 실행을 취소한다(Windows 러너는 분당 비용이 리눅스의 2배)
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CI 사이드로드용. 스토어 제출본은 Partner Center 값으로 로컬에서 scripts/msix-build.ps1을 돌린다.
  # Publisher는 아래에서 만드는 자체 서명 인증서의 Subject와 글자 하나까지 같아야 서명이 통과한다
  MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER || 'CN=Aru CI Test' }}
  MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME || 'Aru CI' }}
  MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME || 'dev.aruu.aru' }}
  # Tauri 2는 exe를 Cargo 패키지명으로 낸다(tauri.conf.json에 mainBinaryName이 없을 때). [[bin]] aru-cli는 aru-cli.exe
  MSIX_GUI_EXE: aru.exe
  MSIX_CLI_EXE: aru-cli.exe

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: cargo test (NTFS)
        working-directory: src-tauri
        run: cargo test

      # e2e/harness.mjs는 playwright-core로 chromium.launch({ channel: "chrome" }) — 설치된 Google Chrome을 쓴다.
      # windows-latest 이미지에 Chrome이 있으므로 브라우저 내려받기 단계는 두지 않았다
      - name: e2e (Chrome, 맥 프로필)
        run: npm run e2e

      # package.json의 "e2e:win"은 `E2E_PLATFORM=win node …` POSIX 꼴이라 Windows npm(cmd.exe)에서는 실패한다.
      # 스크립트를 고치는 대신 여기서 환경 변수를 넣고 같은 명령을 직접 부른다
      - name: e2e (Chrome, Windows 프로필)
        env:
          E2E_PLATFORM: win
        run: node e2e/run.mjs

      # --no-bundle: Tauri 번들러(NSIS·MSI)는 쓰지 않는다. MSIX는 scripts/msix-build.ps1이 만든다.
      # beforeBuildCommand(npm run build)가 한 번 더 돈다 — 위 단계와 중복이지만 단순함을 택했다
      - name: tauri build x64
        run: npx tauri build --no-bundle

      # 설계 문서는 `cargo build --target aarch64…`(빌드만)이라 적었지만, cargo를 직접 부르면 tauri/custom-protocol
      # 기능이 빠져 앱이 devUrl(localhost:1420)을 보는 개발 빌드가 된다. 번들에 넣을 것이므로 tauri build로 만든다
      - name: tauri build arm64 (빌드만, 실행은 VM)
        run: npx tauri build --no-bundle --target aarch64-pc-windows-msvc

      - name: 산출물 목록(exe 이름·DLL 유무 확인용)
        run: |
          Get-ChildItem src-tauri/target/release, src-tauri/target/aarch64-pc-windows-msvc/release -File |
            Where-Object { $_.Extension -in '.exe', '.dll' } | Format-Table FullName, Length

      - name: 사이드로드용 자체 서명 인증서
        run: |
          $pw = [guid]::NewGuid().ToString()
          $cert = New-SelfSignedCertificate -Type Custom -Subject $env:MSIX_PUBLISHER `
            -KeyUsage DigitalSignature -FriendlyName "Aru CI" -CertStoreLocation Cert:\CurrentUser\My `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pfx = Join-Path $env:RUNNER_TEMP "aru-ci.pfx"
          $cer = Join-Path $env:RUNNER_TEMP "aru-ci.cer"
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString $pw -Force -AsPlainText) | Out-Null
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          # 러너는 관리자 권한이라 신뢰 저장소에 넣을 수 있다. 이게 있어야 Add-AppxPackage가 받아 준다
          Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          "MSIX_PFX=$pfx" >> $env:GITHUB_ENV
          "MSIX_PFX_PASSWORD=$pw" >> $env:GITHUB_ENV
          Write-Output "::add-mask::$pw"

      - name: MSIX 패키징(x64 + arm64 → msixbundle)
        run: ./scripts/msix-build.ps1 -Arch x64, arm64

      # 사이드로드 설치에는 개발자 모드(또는 「앱 사이드로드」 허용)가 필요하다.
      # 러너에서 개발자 모드를 켜 두고 설치한다(확인 필요 항목)
      - name: 개발자 모드 켜기
        run: |
          $key = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          New-Item -Path $key -Force | Out-Null
          Set-ItemProperty -Path $key -Name AllowDevelopmentWithoutDevLicense -Value 1 -Type DWord

      # Appx 모듈은 pwsh 7에서 플랫폼 미지원 오류가 나는 버전이 있어 설치·조회 단계는 Windows PowerShell 5.1로 돌린다.
      # 5.1은 BOM 없는 스크립트의 한글을 깨뜨리므로 이 단계들의 본문은 ASCII로만 쓴다
      - name: 사이드로드 설치
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $bundle = Get-ChildItem src-tauri/target/msix/*.msixbundle | Select-Object -First 1
          Add-AppxPackage -Path $bundle.FullName
          Get-AppxPackage -Name $env:MSIX_IDENTITY_NAME | Format-List Name, PackageFullName, InstallLocation, Architecture

      # 패키지 문맥에서 alias가 PATH에 생기고 콘솔에 출력이 붙는지 본다. 사용자 폴더는 임시 폴더로 격리한다
      - name: 스모크 — 설치된 alias로 aru list
        run: |
          $alias = Join-Path $env:LOCALAPPDATA "Microsoft\WindowsApps\aru.exe"
          if (-not (Test-Path $alias)) { throw "alias가 없습니다: $alias" }
          # $HOME은 PowerShell 자동 변수(읽기 전용)라 다른 이름을 쓴다
          $isolated = New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP "aru-home")
          $env:USERPROFILE = $isolated.FullName
          $out = & $alias list 2>&1
          $code = $LASTEXITCODE
          Write-Output $out
          if ($code -ne 0) { throw "aru list 종료 코드 $code" }

      # D2 확인용(실패해도 잡은 계속): add가 남긴 할 일 파일이 문서 폴더 Documents\Aru(가상화 대상 아님)에 생기는지,
      # 설정 파일(location.json 등)은 %LOCALAPPDATA%\dev.aruu.aru 또는 패키지 LocalCache 중 어디로 갔는지 관찰한다.
      # 참고: 문서 폴더는 USERPROFILE 환경 변수로 격리되지 않는다(SHGetKnownFolderPath). 로컬 probe는 LOCALAPPDATA를 임시 폴더로 바꾸고
      # 그 안의 location.json으로 저장 폴더를 임시 폴더에 두는 식으로 격리한다.
      - name: 스모크 — 저장 위치 관찰
        continue-on-error: true
        shell: powershell
        run: |
          $alias = Join-Path $env:LOCALAPPDATA "Microsoft\WindowsApps\aru.exe"
          & $alias add "CI smoke"
          Write-Output "add exit code $LASTEXITCODE"
          $docs = Join-Path ([Environment]::GetFolderPath("MyDocuments")) "Aru"
          $cfg = Join-Path $env:LOCALAPPDATA "dev.aruu.aru"
          $pfn = (Get-AppxPackage -Name $env:MSIX_IDENTITY_NAME).PackageFamilyName
          $virt = Join-Path $env:LOCALAPPDATA "Packages\$pfn\LocalCache\Local\dev.aruu.aru"
          foreach ($p in $docs, $cfg, $virt) {
            Write-Output "== $p (exists: $(Test-Path $p))"
            if (Test-Path $p) { Get-ChildItem $p -Recurse | Format-Table FullName, Length }
          }

      # 스토어 인증 사전 검사. 러너에서 되는지 모르는 단계라 실패해도 잡을 깨지 않는다
      - name: WACK
        continue-on-error: true
        run: |
          $appcert = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\App Certification Kit\appcert.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $appcert) { throw "appcert.exe가 러너에 없습니다" }
          $bundle = Get-ChildItem src-tauri/target/msix/*.msixbundle | Select-Object -First 1
          $report = Join-Path $env:RUNNER_TEMP "wack\report.xml"
          New-Item -ItemType Directory -Force (Split-Path $report) | Out-Null
          & $appcert.FullName reset
          & $appcert.FullName test -appxpackagepath $bundle.FullName -reportoutputpath $report
          Write-Output "appcert 종료 코드 $LASTEXITCODE"
          if (Test-Path $report) { Select-String -Path $report -Pattern 'OVERALL_RESULT' | ForEach-Object { $_.Line } }

      - name: 아티팩트 — MSIX
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aru-msix
          path: |
            src-tauri/target/msix/*.msix
            src-tauri/target/msix/*.msixbundle
          if-no-files-found: warn

      - name: 아티팩트 — WACK 보고서
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wack-report
          path: ${{ runner.temp }}/wack/
          if-no-files-found: ignore

      # 아래 webdriver 잡이 패키지 없이도 돌 수 있게 x64 exe를 넘긴다
      - name: 아티팩트 — x64 exe(내부용)
        uses: actions/upload-artifact@v4
        with:
          name: aru-x64-exe
          path: |
            src-tauri/target/release/aru.exe
            src-tauri/target/release/aru-cli.exe
          retention-days: 3

  # 초안만. 설치된 실제 앱을 tauri-driver + msedgedriver로 띄워 스크린샷을 남긴다.
  # 테스트 프레임워크 없이 WebDriver REST를 pwsh로 직접 부른다(세션 → 스크린샷 → 종료)
  webdriver-smoke:
    needs: build
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aru-msix
          path: msix
      - uses: actions/download-artifact@v4
        with:
          name: aru-x64-exe
          path: exe

      - uses: dtolnay/rust-toolchain@stable

      # msedgedriver는 설치된 Edge(=WebView2 런타임)와 버전이 같아야 한다. 다르면 세션이 멈춘다
      - name: tauri-driver · msedgedriver 설치
        run: |
          cargo install tauri-driver --locked
          cargo install --git https://github.com/chippers/msedgedriver-tool
          & "$env:USERPROFILE\.cargo\bin\msedgedriver-tool.exe"
          Get-ChildItem msedgedriver.exe | Format-Table FullName

      # 서명 인증서는 build 잡의 임시 인증서라 여기서는 없다. 서명 검증을 건너뛰는 설치를 시도하고,
      # 안 되면 패키지 없는 exe로 대신 띄운다(그 경우 패키지 문맥 검증은 아님)
      - name: 설치 시도
        id: install
        shell: powershell
        run: |
          $key = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          New-Item -Path $key -Force | Out-Null
          Set-ItemProperty -Path $key -Name AllowDevelopmentWithoutDevLicense -Value 1 -Type DWord
          $app = (Resolve-Path exe/aru.exe).Path
          try {
            $msix = Get-ChildItem msix/*_x64.msix | Select-Object -First 1
            Add-AppxPackage -Path $msix.FullName -AllowUnsigned
            $loc = (Get-AppxPackage -Name $env:MSIX_IDENTITY_NAME).InstallLocation
            if ($loc) { $app = Join-Path $loc $env:MSIX_GUI_EXE }
          } catch { Write-Warning "package install failed, falling back to built exe: $_" }
          Write-Output "app path: $app"
          "app=$app" >> $env:GITHUB_OUTPUT

      - name: 띄우고 스크린샷
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          $driver = Start-Process "$env:USERPROFILE\.cargo\bin\tauri-driver.exe" `
            -ArgumentList "--native-driver", (Resolve-Path msedgedriver.exe).Path -PassThru
          Start-Sleep -Seconds 3
          try {
            $body = @{ capabilities = @{ alwaysMatch = @{ browserName = "wry"; "tauri:options" = @{ application = "${{ steps.install.outputs.app }}" } } } } |
              ConvertTo-Json -Depth 6
            $session = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:4444/session -Body $body -ContentType application/json
            $id = $session.value.sessionId
            Start-Sleep -Seconds 3
            $shot = Invoke-RestMethod -Uri "http://127.0.0.1:4444/session/$id/screenshot"
            [IO.File]::WriteAllBytes((Join-Path $PWD "shots\main.png"), [Convert]::FromBase64String($shot.value))
            $title = Invoke-RestMethod -Uri "http://127.0.0.1:4444/session/$id/title"
            Write-Output "창 제목: $($title.value)"
            Invoke-RestMethod -Method Delete -Uri "http://127.0.0.1:4444/session/$id" | Out-Null
          } finally {
            Stop-Process -Id $driver.Id -Force -ErrorAction SilentlyContinue
          }

      - name: 아티팩트 — 스크린샷
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webdriver-screenshots
          path: shots/
          if-no-files-found: ignore
