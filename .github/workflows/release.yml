name: Release

# v0.2.0 같은 태그를 올리면 맥 앱을 빌드·서명해 GitHub Releases에 올린다.
# 설치된 앱은 latest.json을 보고 새 버전을 찾는다.
# 바뀐 점은 태그 메시지에 "- 항목" 줄로 적는다(git tag -a v0.2.2 -F notes.md). 앱의 설정 화면과 버튼 툴팁에 그대로 보인다.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # checkout은 태그 이름만 가져와서 태그 메시지(바뀐 점)를 따로 받아 온다
      - name: Read release notes
        id: notes
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          {
            echo "body<<__NOTES__"
            git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" | sed '/-----BEGIN PGP/,$d'
            echo "__NOTES__"
          } >> "$GITHUB_OUTPUT"

      - run: npm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Aru ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false

      # 소개 페이지의 다운로드 버튼은 버전과 상관없이 늘 같은 이름의 최신 파일을 가리킨다
      - name: Upload Aru-mac.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd src-tauri/target/release/bundle/macos
          ditto -c -k --sequesterRsrc --keepParent Aru.app Aru-mac.zip
          gh release upload "${{ github.ref_name }}" Aru-mac.zip --clobber
