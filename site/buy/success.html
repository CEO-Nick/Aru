<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aru 구매 완료</title>
<link rel="icon" href="../favicon.png" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="style.css" />
<script src="config.js"></script>
</head>
<body>
<main>
  <a class="brand" href="../"><img src="../icon.png" alt="" />Aru</a>
  <h1 id="title">결제를 확인하고 있어요…</h1>
  <div id="done" hidden>
    <p class="lead">고마워요. 아래가 라이선스 키예요. 잃어버리지 않게 어딘가 적어 두세요.</p>
    <div class="key" id="key"></div>
    <button id="copy" class="btn">키 복사하기</button>
    <div class="card">
      <ol>
        <li>Aru 창에서 <b>톱니(설정)</b>를 눌러요.</li>
        <li><b>라이선스 키 붙여넣기</b> 칸에 붙여 넣고 <b>등록</b>을 눌러요.</li>
        <li>"등록됨"이 보이면 끝이에요.</li>
      </ol>
    </div>
  </div>
  <p id="error" class="error" hidden></p>
</main>
<script>
  const q = new URLSearchParams(location.search);
  const title = document.getElementById("title");
  const error = document.getElementById("error");
  (async () => {
    try {
      const res = await fetch(`${window.ARU_PAY.api}/confirm`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          paymentKey: q.get("paymentKey"),
          orderId: q.get("orderId"),
          amount: Number(q.get("amount")),
          name: sessionStorage.getItem("aru-pay-email") ?? "",
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message ?? "결제를 확인하지 못했어요.");
      title.textContent = "구매 완료";
      document.getElementById("key").textContent = data.license;
      document.getElementById("done").hidden = false;
      document.getElementById("copy").onclick = async (e) => {
        await navigator.clipboard.writeText(data.license);
        e.target.textContent = "복사했어요";
      };
    } catch (e) {
      title.textContent = "결제를 확인하지 못했어요";
      error.textContent = `${e.message} 결제가 되었는데 키를 못 받았다면, 이 화면을 새로고침하거나 의견 보내기로 알려 주세요. 주문번호: ${q.get("orderId") ?? "-"}`;
      error.hidden = false;
    }
  })();
</script>
</body>
</html>
