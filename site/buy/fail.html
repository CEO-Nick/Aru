<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aru 결제 실패</title>
<link rel="icon" href="../favicon.png" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<main>
  <a class="brand" href="../"><img src="../icon.png" alt="" />Aru</a>
  <h1>결제가 되지 않았어요</h1>
  <p class="lead" id="msg">돈은 나가지 않았어요.</p>
  <a class="btn" href="./" style="text-align:center;text-decoration:none">다시 시도하기</a>
</main>
<script>
  const m = new URLSearchParams(location.search).get("message");
  if (m) document.getElementById("msg").textContent = `${m} 돈은 나가지 않았어요.`;
</script>
</body>
</html>
