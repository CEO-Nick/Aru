<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Aru 앱스토어 스크린샷 무대</title>
<!-- 1440×900을 2배로 찍어 2880×1800(앱스토어 맥 스크린샷 규격)을 만든다. ?scene=main|quick|overview|midnight|ai -->
<style>
  html, body { margin: 0; width: 1440px; height: 900px; overflow: hidden; }
  body {
    position: relative;
    background:
      radial-gradient(90% 70% at 85% 110%, #ff8a3d55 0%, transparent 60%),
      radial-gradient(60% 50% at 0% 0%, #3d6bff22 0%, transparent 60%),
      linear-gradient(165deg, #141518 0%, #1b1d21 55%, #2a211c 100%);
    font-family: -apple-system, "Apple SD Gothic Neo", sans-serif;
    color: #f2eee8;
  }
  .copy { position: absolute; left: 96px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; }
  .copy h1 { margin: 0 0 22px; font-size: 64px; line-height: 1.18; font-weight: 800; letter-spacing: -1.5px; }
  .copy p { margin: 0; font-size: 26px; line-height: 1.6; color: #c9c3bb; font-weight: 500; letter-spacing: -0.3px; }
  .copy .key { display: inline-block; font-size: 22px; font-weight: 700; padding: 4px 12px; border-radius: 10px; background: #2a2b2f; border: 1px solid #ffffff2a; border-bottom-width: 3px; margin-right: 6px; vertical-align: 4px; }
  /* 위에 문구가 오는 넓은 장면(달력) */
  body.top .copy { left: 0; right: 0; width: auto; top: 58px; bottom: auto; text-align: center; }
  body.top .copy h1 { font-size: 48px; margin-bottom: 10px; }
  body.top .copy p { font-size: 22px; }

  .editor {
    position: absolute; left: 700px; top: 70px; width: 640px; height: 760px;
    background: #1b1c1fd9; border: 1px solid #ffffff14; border-radius: 16px; overflow: hidden;
    color: #9aa3b8; font: 15px/1.75 "SF Mono", Menlo, monospace; white-space: pre; padding: 54px 26px 0; box-sizing: border-box;
  }
  .editor .bar { position: absolute; left: 16px; top: 16px; display: flex; gap: 8px; }
  .editor .bar i { width: 12px; height: 12px; border-radius: 50%; background: #4a4b50; }
  .editor b { color: #e6a26b; font-weight: 400 } .editor i { color: #7fd1b9; font-style: normal } .editor u { color: #ffb86b; text-decoration: none }
  .editor .prompt { color: #7fd1b9 } .editor .muted { color: #6b7080 } .editor .ok { color: #9ad48a }

  .win {
    position: absolute; width: 320px; height: 470px; border-radius: 12px; overflow: hidden;
    box-shadow: 0 40px 90px #000000a0, 0 0 0 1px #ffffff1f; transform-origin: top left;
  }
  .win iframe, .quick iframe, .big iframe { width: 100%; height: 100%; border: 0; display: block; background: #262628; }
  .lights { position: absolute; left: 12px; top: 11px; display: flex; gap: 8px; pointer-events: none; }
  .lights i { width: 12px; height: 12px; border-radius: 50%; }
  .lights i:nth-child(1) { background: #ff5f57 } .lights i:nth-child(2) { background: #febc2e } .lights i:nth-child(3) { background: #28c840 }
  .quick { position: absolute; width: 620px; height: 96px; transform-origin: top left; border-radius: 14px; overflow: hidden; box-shadow: 0 30px 70px #000000b0, 0 0 0 1px #ffffff24; }
  .quick iframe { background: transparent; }
  .big { position: absolute; left: 212px; top: 196px; width: 1180px; height: 788px; border-radius: 12px; overflow: hidden; transform: scale(0.86); transform-origin: top left; box-shadow: 0 40px 90px #000000a0, 0 0 0 1px #ffffff1f; background: #1f1f21; }
  /* 모아보기는 일반 창이라 내용 위에 제목 막대가 따로 있다 */
  .big .titlebar { height: 28px; position: relative; }
  .big iframe { height: 760px; }
</style>
</head>
<body>
<div class="copy"><h1 id="title"></h1><p id="sub"></p></div>
<script>
  const scene = new URLSearchParams(location.search).get("scene") ?? "main";
  const code = `<b>export</b> <b>function</b> <i>planWeek</i>(tasks) {
  <b>const</b> today = tasks.<i>filter</i>(t =&gt; t.due === <u>"today"</u>)
  <b>const</b> someday = tasks.<i>filter</i>(t =&gt; !t.due)
  <b>return</b> { today, someday }
}

<b>describe</b>(<u>"planWeek"</u>, () =&gt; {
  <i>it</i>(<u>"keeps someday tasks out of today"</u>, () =&gt; {
    <b>const</b> week = <i>planWeek</i>(fixtures)
    <i>expect</i>(week.today).<i>toHaveLength</i>(<u>3</u>)
  })
})`;
  const terminal = `<span class="prompt">&gt;</span> 회의 준비할 거 세 개 오늘 할 일에 넣어 줘

<span class="muted">● aru - add_todos (MCP)</span>
  <span class="ok">✓</span> 회의 자료 출력
  <span class="ok">✓</span> 지난 회의록 다시 읽기
  <span class="ok">✓</span> 질문 목록 정리

오늘 할 일에 3개를 넣었어요.`;
  const scenes = {
    main: { title: "모든 창 위에,<br>오늘 할 일", sub: "작은 창 하나에 오늘 할 일만 띄워 둬요.<br>다른 일을 하는 동안에도 늘 보여요.", editor: code, win: [900, 120, 1.45] },
    quick: { title: "어디서든<br>바로 적기", sub: '<span class="key">⌥</span><span class="key">Space</span> 를 누르면 입력창이 떠요.<br>쓰던 앱을 떠나지 않고 한 줄로 적어요.', editor: code, win: [1010, 250, 1.2], quick: [660, 120, 1.0] },
    overview: { top: true, title: "한 달을 한눈에", sub: "달력에서 날짜를 골라 고치고, 언젠가 할 일을 날짜로 끌어다 놓아요." },
    midnight: { title: "끝내지 못한 일은<br>다음 날로", sub: "자정이 지나면 남은 일이<br>어디서 넘어왔는지 표시를 달고 따라와요.", editor: code, win: [900, 120, 1.45] },
    ai: { title: "AI에게 말하면<br>할 일로", sub: "Claude·Codex에게 부탁하면<br>Aru에 바로 들어가요. 누가 넣었는지도 보여요.", editor: terminal, win: [960, 190, 1.3], editorBox: [640, 110, 560, 420] },
  };
  const s = scenes[scene];
  document.getElementById("title").innerHTML = s.title;
  document.getElementById("sub").innerHTML = s.sub;
  if (s.top) document.body.classList.add("top");
  if (s.editor) {
    const e = document.createElement("div");
    e.className = "editor";
    e.innerHTML = `<div class="bar"><i></i><i></i><i></i></div>` + s.editor;
    if (s.editorBox) Object.assign(e.style, { left: s.editorBox[0] + "px", top: s.editorBox[1] + "px", width: s.editorBox[2] + "px", height: s.editorBox[3] + "px" });
    document.body.appendChild(e);
  }
  if (s.win) {
    const [x, y, k] = s.win;
    const w = document.createElement("div");
    w.className = "win";
    Object.assign(w.style, { left: x + "px", top: y + "px", transform: `scale(${k})` });
    w.innerHTML = `<iframe id="app" src="/index.html"></iframe><div class="lights"><i></i><i></i><i></i></div>`;
    document.body.appendChild(w);
  }
  if (s.quick) {
    const [x, y, k] = s.quick;
    const q = document.createElement("div");
    q.className = "quick";
    Object.assign(q.style, { left: x + "px", top: y + "px", transform: `scale(${k})` });
    q.innerHTML = `<iframe id="quick" src="/index.html#quick"></iframe>`;
    document.body.appendChild(q);
  }
  if (scene === "overview") {
    const b = document.createElement("div");
    b.className = "big";
    b.innerHTML = `<div class="titlebar"><div class="lights"><i></i><i></i><i></i></div></div><iframe id="app" src="/index.html#overview"></iframe>`;
    document.body.appendChild(b);
  }
</script>
</body>
</html>
